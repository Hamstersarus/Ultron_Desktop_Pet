<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Ultron</title>
    <style>
    @font-face {
      font-family: 'VT323';
      src: url('assets/fonts/VT323-Regular.ttf');
    }
    :root {
      --steel-dark: #16181d;
      --steel: #2a2f38;
      --steel-light: #8a919c;
      --ultron-red: #ff2a2a;
      --ultron-red-dim: #7a0f0f;
      --text: #e6e6e6;
    }
    html, body {
      margin: 0;
      background: transparent;
      overflow: hidden;
      font-family: 'VT323', monospace;
      button, input {
        font: inherit;
      }
    }
    #ultron {
      display: block;
      width: 150px;
      height: 150px;
      margin: 20px auto 0;
      image-rendering: pixelated;
      -webkit-app-region: drag;
      }

      #bubble {
        position: relative;
        margin: 10px;
        padding: 10px 14px;
        min-height: 60px;
        max-height: 110px;
        overflow-y: auto;
        background: white;
        color: black;
        border-radius: 14px;
        font-size: 20px;
      }

      /* the little tail pointing down at Ultron */
      #bubble::after {
        content: "";
        position: absolute;
        bottom: -10px;
        left: 50%;
        border: 10px solid transparent;
        border-top-color: white;
        border-bottom: 0;
      }
      
      #buttons {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin: 10px auto;
      }

      #buttons button{
        cursor: pointer;
      }

      #ask, #settings {
        display: flex;
        gap: 6px;
        margin: 0 10px;
      }

      #question, #key-input {
        flex: 1;
      }

      [hidden] {
        display: none !important;
      }
      </style>
    </head>
    <body>
      <div id="bubble" hidden></div>

      <img id="ultron" src="assets/idle.png" alt="Ultron" draggable="false">
      
      <div id = "buttons">
        <button id="talk">💬</button>
        <button id="settings-button">⚙️</button>
    </div>

      <form id="ask" hidden>
        <input id="question" type="text" placeholder="Ask Ultron..." autocomplete="off">
        <button type="submit">Ask</button>
      </form>

      <form id="settings" hidden>
        <input id="key-input" type="password" placeholder="Paste your sk-or-... key" autocomplete="off">
        <button type="submit">Save </button>
      </form>

      <script src="renderer.js"></script>
    </body>
  </html>
