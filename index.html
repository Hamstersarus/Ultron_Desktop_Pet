<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
        <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">

    <title>Ultron</title>
    <style>
    @font-face {
      font-family: 'VT323';
      src: url('assets/fonts/VT323-Regular.ttf');
    }
    :root {
      --steel-dark: #16181d;
      --steel: #2a2f38;
      --steel-light: #8a919c;
      --ultron-red: #ff2a2a;
      --ultron-red-dim: #7a0f0f;
      --text: #e6e6e6;
    }
    html, body {
      margin: 0;
      background: transparent;
      overflow: hidden;
      font-family: 'VT323', monospace;
    }

    button, input {
      font: inherit;
    }
    #ultron {
      display: block;
      width: 150px;
      height: 150px;
      margin: 20px auto 0;
      image-rendering: pixelated;
      -webkit-app-region: drag;
      filter: drop-shadow(0 0 4px rgba(255, 42, 42, 0.5));
      animation: hover-bob 2.4s ease-in-out infinite;
      object-fit: contain;
      }

      #bubble {
        position: relative;
        margin: 10px 10px 18px;
        padding: 8px 12px;
        background: var(--steel-dark);
        color: var(--text);
        border: 2px solid var(--ultron-red);
        border-radius: 4px;
        box-shadow: 0 0 10px var(--ultron-red-dim);
        font-size: 20px;
        line-height: 1.1;
        transform-origin: bottom center;
        animation: pop-in 0.15s ease-out;
      }

      #bubble-text {
        max-height: 100px;
        overflow-y: auto;
        padding-right: 4px;
      }

      /* the tail: a red triangle with a smaller dark triangle on top */
      #bubble::before,
      #bubble::after {
        content: "";
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        border-style: solid;
        border-color: transparent;
      }

      #bubble::before {
        bottom: -12px;
        border-width: 12px 10px 0;
        border-top-color: var(--ultron-red);
      }

      #bubble::after {
        bottom: -8px;
        border-width: 9px 7.5px 0;
        border-top-color: var(--steel-dark);
      }

      /* thin red scrollbar for long answers */
      #bubble-text::-webkit-scrollbar {
        width: 6px;
      }

      #bubble-text::-webkit-scrollbar-thumb {
        background: var(--ultron-red-dim);
        border-radius: 3px;
      }

      #bubble-text::-webkit-scrollbar-track {
        background: transparent;
      }
      
      #buttons {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin: 10px auto;
      }

      button {
        background: var(--steel);
        color: var(--text);
        border: 2px solid var(--steel-light);
        border-radius: 2px;
        padding: 2px 10px;
        font-size: 18px;
        cursor: pointer;
        box-shadow: inset -2px -2px 0 var(--steel-dark);
      }

      button:hover {
        border-color: var(--ultron-red);
        box-shadow: inset -2px -2px 0 var(--steel-dark), 0 0 6px var(--ultron-red-dim);
      }

      button:active {
        transform: translateY(1px);
        box-shadow: inset 2px 2px 0 var(--steel-dark);
      }

      input {
        background: var(--steel-dark);
        color: var(--text);
        border: 2px solid var(--steel-light);
        border-radius: 2px;
        padding: 2px 6px;
        font-size: 18px;
        outline: none;
        caret-color: var(--ultron-red);
      }

      input:focus {
        border-color: var(--ultron-red);
        box-shadow: 0 0 6px var(--ultron-red-dim);
      }

      input::placeholder {
        color: var(--steel-light);
      }

      #ask, #settings {
        display: flex;
        gap: 6px;
        margin: 0 10px;
      }

      #question, #key-input {
        flex: 1;
      }

      [hidden] {
        display: none !important;
      }

      @keyframes pop-in {
        from {
          transform: scale(0.8);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }

      @keyframes hover-bob {
        0%, 100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-6px);
        }
      }
      </style>
    </head>
    <body>
      <div id="bubble" hidden>
        <div id="bubble-text"></div>
      </div>

      <img id="ultron" src="assets/idle.png" alt="Ultron" draggable="false">
      
      <div id="buttons">
        <button id="talk">💬</button>
        <button id="settings-button">⚙️</button>
    </div>

      <form id="ask" hidden>
        <input id="question" type="text" placeholder="Ask Ultron..." autocomplete="off">
        <button type="submit">Ask</button>
      </form>

      <form id="settings" hidden>
        <input id="key-input" type="password" placeholder="Paste your sk-or-... key" autocomplete="off">
        <button type="submit">Save </button>
      </form>

      <script src="renderer.js"></script>
    </body>
  </html>
